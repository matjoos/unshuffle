name: CI

on:
  pull_request:
  push:
    branches: [autopilot]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
        if: hashFiles('playwright.config.js') != ''
      - run: npm test
